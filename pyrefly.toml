# Pyrefly configuration for FYN project
# Using standalone pyrefly.toml format (top-level keys, not [tool.pyrefly])

python-interpreter-path = "backend/venv/bin/python3"
site-package-path = ["backend/venv/lib/python3.9/site-packages"]
project-includes = ["backend"]
project-excludes = ["**/.[!/.]*", "backend/venv", "frontend"]

# Suppress false positives common in Django projects:
# - untyped-import: Django doesn't ship type stubs
# - bad-override: Django uses descriptors that confuse strict checkers
# - missing-attribute: Django's `objects` manager is added dynamically by metaclass
errors-to-ignore = ["untyped-import", "bad-override", "missing-attribute"]
